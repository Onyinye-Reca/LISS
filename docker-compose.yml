# Local Postgres for development. Start with: docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: liss11
    # Host port 5544 avoids clashing with a local Postgres.app on 5432.
    # Bound to 127.0.0.1 explicitly so it doesn't depend on localhost's
    # IPv4/IPv6 resolution order.
    ports:
      - "127.0.0.1:5544:5432"
    volumes:
      - liss11_pgdata:/var/lib/postgresql/data

volumes:
  liss11_pgdata:
