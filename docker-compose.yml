# Local Postgres for development. Start with: docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: liss11
    ports:
      - "5432:5432"
    volumes:
      - liss11_pgdata:/var/lib/postgresql/data

volumes:
  liss11_pgdata:
