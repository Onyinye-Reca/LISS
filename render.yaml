services:
  - type: web
    name: liss11-api-staging
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build:shared && npm run db:generate && npm run build:api && npm run db:migrate:deploy
    startCommand: npm run start --workspace apps/api
    healthCheckPath: /health/
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        value: https://liss11.netlify.app
      # Public base URL of THIS API. Verification/reset links are built from it,
      # so without it they default to http://localhost:4000 and break.
      - key: API_BASE_URL
        value: https://liss11-api-staging.onrender.com
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: SENTRY_DSN
        sync: false
      # --- Email delivery: Resend (HTTP API) ---
      # Render blocks outbound SMTP, so email goes through Resend rather than
      # Gmail SMTP. Set RESEND_API_KEY (starts with "re_") in the dashboard.
      # To send to any recipient, verify a domain in Resend and point EMAIL_FROM
      # at it (e.g. no-reply@liss11.org); the default onboarding@resend.dev
      # sender only reaches the email you registered the Resend account with.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "LISS11' Alumni <onboarding@resend.dev>"
      # Inbox that receives contact-form notifications (staging). Production
      # uses lissclass11@gmail.com.
      - key: CONTACT_TO
        value: emove.nig@gmail.com
      # Paystack secret key (sk_test_... on staging). Used to start transactions
      # and to verify webhook signatures. Set in the dashboard. Also add the
      # webhook URL https://liss11-api-staging.onrender.com/payments/webhook in
      # the Paystack dashboard. Without this key, payments return 503.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      # Media uploads (Cloudinary). Without it, uploads use local disk, which is
      # ephemeral on Render's free tier (wiped on redeploy). Format:
      # cloudinary://<api_key>:<api_secret>@<cloud_name>
      - key: CLOUDINARY_URL
        sync: false
      # Staging Postgres lives on Neon (free). Paste the connection string
      # into the Render dashboard after the service is created.
      - key: DATABASE_URL
        sync: false
