services:
  - type: web
    name: liss11-api-staging
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build:shared && npm run db:generate && npm run build:api && npm run db:migrate:deploy
    startCommand: npm run start --workspace apps/api
    healthCheckPath: /health/
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        value: https://liss11.netlify.app
      # Public base URL of THIS API. Verification/reset links are built from it,
      # so without it they default to http://localhost:4000 and break.
      - key: API_BASE_URL
        value: https://liss11-api-staging.onrender.com
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: SENTRY_DSN
        sync: false
      # --- Email delivery: Gmail SMTP ---
      # Staging sends from emove.nig@gmail.com. (Production uses
      # lissclass11@gmail.com - set that on the production service.)
      # SMTP_PASS is a Google App Password (16 chars, requires 2-Step
      # Verification) for emove.nig@gmail.com, NOT the normal Gmail password.
      # Set it in the dashboard.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: emove.nig@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: "LISS11' Alumni <emove.nig@gmail.com>"
      # Alternative provider, unused while SMTP_* is set. Needs a verified
      # sending domain in Resend; leave blank when using Gmail SMTP.
      - key: RESEND_API_KEY
        sync: false
      # Staging Postgres lives on Neon (free). Paste the connection string
      # into the Render dashboard after the service is created.
      - key: DATABASE_URL
        sync: false
