services:
  - type: web
    name: liss11-api-staging
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:shared && npm run db:generate && npm run build:api
    preDeployCommand: npm run db:migrate:deploy
    startCommand: npm run start --workspace apps/api
    healthCheckPath: /health/
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        value: https://staging-liss11.netlify.app
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: SENTRY_DSN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: liss11-staging-db
          property: connectionString

databases:
  - name: liss11-staging-db
    plan: basic-256mb
    databaseName: liss11_staging
    user: liss11_staging
